name: Build Mechanica
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'
      - run: cd mechanica && gradle build -x test
      - uses: actions/upload-artifact@v4
        with:
          name: mechanica-1.20.1
          path: mechanica/build/libs/*.jar

